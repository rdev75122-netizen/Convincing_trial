<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cards-container">
        <div class="messages">
            <h2>Toh yeh hai woh cheating joh me har raat tere jaane ke baad karta hu sapno me...</h2>
            <p>Teri yaadon ko baar baar jeeta hu... Abh Tere hote hue agar mujhe tere sapne dekhne pad rahe hai toh
                cheating hi Hui na </p>
        </div>
        <div class="cards">
            <div class="card-scene">
                <div class="card" data-card="1">
                    <div class="card-face card-front">1</div>
                    <div class="card-face card-back">
                        <img src="./image1.jpeg" alt="Card 1">
                    </div>
                </div>
            </div>
            <div class="card-scene">
                <div class="card" data-card="2">
                    <div class="card-face card-front">2</div>
                    <div class="card-face card-back">
                        <img src="./image2.jpeg" alt="Card 2">
                    </div>
                </div>
            </div>
            <div class="card-scene">
                <div class="card disabled" data-card="3">
                    <div class="card-face card-front">3</div>
                    <div class="card-face card-back">
                        <img src="./image3.jpeg" alt="Card 3">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
